services:
  # Pipeline API - Python backend
  pipeline-api:
    image: ${AIWAF_PIPELINE_IMAGE:-ghcr.io/brunodpl/aiwaf-pipeline:latest}
    container_name: pipeline-api
    labels:
      # Watchtower vigila este contenedor y lo reemplaza cuando hay imagen nueva.
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      # Host:Container — puerto del host elegido para no chocar con otros servicios
      # típicos (3000/8000 los usan muchas apps). El puerto interno sigue siendo 8000.
      - "8003:8000"
    volumes:
      # Ruta al archivo de credenciales definida en .env (CREDENTIALS_PATH)
      # Ejemplo en .env: CREDENTIALS_PATH=/home/usuario/.secrets/sa.json
      - ${CREDENTIALS_PATH}:/app/credentials/service_account.json:ro
      # Persistir datos de salida — bind mount para trazabilidad visible en host
      - ./sistema-de-asientos-automatizado/data/output:/app/data/output
      # Persistir feedback recibido desde la UI (audit + reintentos)
      - ./sistema-de-asientos-automatizado/data/feedback:/app/data/feedback
      # Maestros y clients.json — datos de referencia
      - ./sistema-de-asientos-automatizado/data/maestros:/app/data/maestros:ro
      - ./sistema-de-asientos-automatizado/data/clients.json:/app/data/clients.json:ro
      # Sandbox para procesamiento de facturas
      - ./sistema-de-asientos-automatizado/horeca_sandbox:/app/horeca_sandbox
      # Logs — bind mount para trazabilidad visible en host
      - ./sistema-de-asientos-automatizado/logs:/app/logs
    env_file:
      - ./sistema-de-asientos-automatizado/.env.docker
    environment:
      # Credenciales: ruta fija dentro del contenedor, el archivo viene del volumen
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/service_account.json
      # CORS: configurar en .env raíz
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3003,http://interfaz-asientos:3000}
      # AIWAF_VERSION ya viene como ENV embebido en la imagen (build-arg de la GH Action).
      # No inyectarlo desde .env aquí — lo sobreescribiría con un valor obsoleto tras docker compose pull.
      # URL del JSON con la última versión publicada (default = Cloudflare Pages oficial)
      - AIWAF_LATEST_VERSION_URL=${AIWAF_LATEST_VERSION_URL:-https://aiwaf-releases.pages.dev/latest.json}
      # Webhook Discord para feedback (configurado por el instalador)
      - FEEDBACK_WEBHOOK_URL=${FEEDBACK_WEBHOOK_URL:-}
      # Identificación de la gestoría — aparece en cada feedback
      - AIWAF_GESTORIA_NIF=${AIWAF_GESTORIA_NIF:-}
      - AIWAF_GESTORIA_NOMBRE=${AIWAF_GESTORIA_NOMBRE:-}
      # Watchtower: el backend llama a este endpoint para forzar update on-demand
      - WATCHTOWER_URL=${WATCHTOWER_URL:-http://watchtower:8080}
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:-}
    networks:
      - asientos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Interfaz - Next.js frontend
  # NEXT_PUBLIC_API_URL ya no es necesario: el proxy reverso en next.config.mjs
  # redirige /api/* a pipeline-api:8000 dentro de la red Docker.
  # Cambiar la IP del servidor NO requiere reconstruir esta imagen.
  interfaz:
    image: ${AIWAF_INTERFAZ_IMAGE:-ghcr.io/brunodpl/aiwaf-interfaz:latest}
    container_name: interfaz-asientos
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "3003:3000"
    depends_on:
      pipeline-api:
        condition: service_healthy
    networks:
      - asientos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Watchtower — actualiza imágenes Docker on-demand cuando recibe POST en su HTTP API.
  # Vigila solo contenedores con label `com.centurylinklabs.watchtower.enable=true`.
  # Lee credenciales de pull desde ~/.docker/config.json (poblado por `docker login` que hace el instalador).
  watchtower:
    image: containrrr/watchtower:latest
    container_name: aiwaf-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Auth GHCR — el instalador escribe ./.docker/config.json con auth base64 explícito
      # (no se puede reusar ~/.docker/config.json porque Docker Desktop en Windows usa
      # credential helper, que un contenedor Linux no puede leer).
      - ./.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=false
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:?WATCHTOWER_HTTP_API_TOKEN must be set in .env}
      # Forzar versión moderna del cliente API. Docker Desktop 4.30+ requiere 1.44+;
      # Watchtower mainline aún negocia 1.25 por defecto.
      - DOCKER_API_VERSION=1.44
    networks:
      - asientos-network

networks:
  asientos-network:
    driver: bridge

