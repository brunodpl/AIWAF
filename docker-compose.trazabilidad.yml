# Override de pruebas — trazabilidad 2.0.
#
# Uso:
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.dev.yml \
#                  -f docker-compose.trazabilidad.yml up -d --build
#
# Expone `libros/` al host (bind mount) para que Bruno pueda:
#   - Soltar PDFs en libros/facturas/{compras,ventas,bienes}/
#   - Inspeccionar libros/asientos/{folder}/.state.json
#   - Verificar que los PDFs nunca se mueven
#   - Consultar libros/logs/audit/*.jsonl
#
# Inyecta LIBROS_BASE=/app/libros sin tocar .env.docker.
services:
  pipeline-api:
    environment:
      - LIBROS_BASE=/app/libros
      # Logs técnicos (pipeline.jsonl) también dentro de libros/ para que
      # el operario tenga TODO en un solo árbol visible desde el host.
      - LOGS_PATH=/app/libros/logs
    volumes:
      - ./libros:/app/libros
