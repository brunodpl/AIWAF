# ============================================================
# maestro_contable_fiscal.yaml v3
# Esquema plano para clasificacion LLM-first.
# Sin match_hints. Sin enums anidados.
# Campo "descripcion" es lo que ve el LLM en el prompt.
# ============================================================

version: 3
name: maestro_contable_fiscal
scope:
  country: ES
  sector: HORECA

# ── CUENTAS ─────────────────────────────────────────────────
# book: compras_gastos | ingresos_ventas | bienes_inversion
# human_review: true requiere revision humana obligatoria

cuentas:

  # ── GRUPO 6: COMPRAS Y GASTOS ────────────────────────────

  - code: "600"
    label: "Compras de mercaderias"
    group: "6"
    book: "compras_gastos"
    class: "gasto_deducible_interior"
    descripcion: >-
      Productos TERMINADOS comprados para vender SIN transformacion:
      bebidas embotelladas (cervezas, vinos, refrescos, agua mineral),
      tabaco, snacks envasados, conservas, hielo en bolsa.
      El producto llega del proveedor y se sirve o vende TAL CUAL, sin elaboracion.
      NO incluye ingredientes crudos ni consumibles del proceso.
    human_review: false

  - code: "601"
    label: "Compras de materias primas"
    group: "6"
    book: "compras_gastos"
    class: "gasto_deducible_interior"
    descripcion: >-
      Ingredientes CRUDOS que se TRANSFORMAN en cocina para elaborar platos o bebidas propias:
      carne cruda, pescado fresco, verduras, fruta, harina, huevos, aceite para cocinar,
      especias a granel, lacteos para elaboraciones.
      La clave: el ingrediente SE ELABORA antes de venderse.
      NO incluye productos que se venden sin transformar ni consumibles del proceso.
    human_review: false

  - code: "602"
    label: "Otros aprovisionamientos"
    group: "6"
    book: "compras_gastos"
    class: "gasto_deducible_interior"
    descripcion: >-
      Consumibles y materiales auxiliares del proceso productivo que NO se venden al cliente:
      envases, cajas de embalaje, papel film, bolsas de plastico, pajitas, servilletas de papel,
      vajilla desechable, palillos, productos de limpieza, guantes de latex, menaje de un solo uso,
      papel de aluminio, film transparente.
      La clave: el articulo SE CONSUME en el proceso pero NO se vende.
    human_review: false

  - code: "607"
    label: "Trabajos realizados por otras empresas"
    group: "6"
    book: "compras_gastos"
    class: "gasto_deducible_interior"
    descripcion: >-
      Servicios del proceso productivo ENCARGADOS A TERCEROS que forman parte de la cadena interna:
      elaboracion de productos por otra empresa, maquila, subcontratacion de produccion,
      trabajos especializados integrados en el producto final.
      Distinto de 623 (honorarios profesionales independientes puntuales).
    human_review: false

  - code: "621"
    label: "Arrendamientos y canones"
    group: "6"
    book: "compras_gastos"
    class: "gasto_deducible_interior"
    descripcion: "Alquiler de local, maquinaria o equipos; leasing operativo y canones"
    human_review: false

  - code: "622"
    label: "Reparaciones y conservacion"
    group: "6"
    book: "compras_gastos"
    class: "gasto_deducible_interior"
    descripcion: "Mantenimiento de activos existentes que no mejoran ni amplian su capacidad"
    human_review: false

  - code: "623"
    label: "Servicios de profesionales independientes"
    group: "6"
    book: "compras_gastos"
    class: "gasto_deducible_interior"
    descripcion: "Honorarios de abogados, asesores, notarios, auditores, arquitectos"
    human_review: false

  - code: "624"
    label: "Transportes"
    group: "6"
    book: "compras_gastos"
    class: "gasto_deducible_interior"
    descripcion: "Gastos de transporte, mensajeria, flete y distribucion realizados por terceros"
    human_review: false

  - code: "625"
    label: "Primas de seguros"
    group: "6"
    book: "compras_gastos"
    class: "gasto_no_deducible_iva"
    descripcion: "Seguros vinculados a la actividad: multirriesgo, responsabilidad civil, vehiculos. Generalmente exentos de IVA"
    human_review: false

  - code: "626"
    label: "Servicios bancarios y similares"
    group: "6"
    book: "compras_gastos"
    class: "gasto_no_deducible_iva"
    descripcion: "Comisiones bancarias, mantenimiento de cuenta, transferencias. Exentos de IVA"
    human_review: false

  - code: "627"
    label: "Publicidad, propaganda y relaciones publicas"
    group: "6"
    book: "compras_gastos"
    class: "gasto_deducible_interior"
    descripcion: "Gastos de marketing, publicidad, diseno grafico, rotulos y patrocinio"
    human_review: false

  - code: "628"
    label: "Suministros"
    group: "6"
    book: "compras_gastos"
    class: "gasto_deducible_interior"
    descripcion: "Consumos de electricidad, agua, gas, telefonia e internet del local"
    human_review: false

  - code: "629"
    label: "Otros servicios"
    group: "6"
    book: "compras_gastos"
    class: "gasto_deducible_interior"
    descripcion: "Otros servicios no clasificados en cuentas anteriores: papeleria, limpieza, suscripciones software, dietas"
    human_review: false

  - code: "631"
    label: "Otros tributos"
    group: "6"
    book: "compras_gastos"
    class: "gasto_no_deducible_iva"
    descripcion: "Tasas e impuestos locales o autonomicos deducibles: IBI, IAE, tasas municipales. Sin IVA"
    human_review: false

  - code: "640"
    label: "Sueldos y salarios"
    group: "6"
    book: "compras_gastos"
    class: "gasto_no_deducible_iva"
    descripcion: "Nominas, sueldos y retribuciones del personal. Sin IVA"
    human_review: true

  - code: "642"
    label: "Seguridad Social a cargo de la empresa"
    group: "6"
    book: "compras_gastos"
    class: "gasto_no_deducible_iva"
    descripcion: "Cuota patronal, cotizaciones TC1/TC2 de Seguridad Social. Sin IVA"
    human_review: true

  # ── GRUPO 7: VENTAS E INGRESOS ───────────────────────────

  - code: "700"
    label: "Ventas de mercaderias"
    group: "7"
    book: "ingresos_ventas"
    class: "ingreso_interior"
    descripcion: "Ingresos por venta de productos sin transformacion"
    human_review: false

  - code: "705"
    label: "Prestacion de servicios"
    group: "7"
    book: "ingresos_ventas"
    class: "ingreso_interior"
    descripcion: "Ingresos por servicios prestados a terceros"
    human_review: false

  # ── GRUPO 2: BIENES DE INVERSION ────────────────────────

  - code: "212"
    label: "Instalaciones tecnicas"
    group: "2"
    book: "bienes_inversion"
    class: "bien_inversion"
    descripcion: "Instalaciones electricas, de gas, climatizacion o frigorificas fijas"
    human_review: true

  - code: "213"
    label: "Maquinaria"
    group: "2"
    book: "bienes_inversion"
    class: "bien_inversion"
    descripcion: "Hornos, lavavajillas industrial, cafetera industrial, camara frigorifica, freidoras"
    human_review: true

  - code: "216"
    label: "Mobiliario"
    group: "2"
    book: "bienes_inversion"
    class: "bien_inversion"
    descripcion: "Muebles, sillas, mesas, mostrador, barra, estanterias de la actividad"
    human_review: true

  - code: "217"
    label: "Equipos para procesos de informacion"
    group: "2"
    book: "bienes_inversion"
    class: "bien_inversion"
    descripcion: "Ordenadores, portatiles, servidores, TPV, tablets, impresoras, escaner"
    human_review: true

  - code: "218"
    label: "Elementos de transporte"
    group: "2"
    book: "bienes_inversion"
    class: "bien_inversion"
    descripcion: "Vehiculos de empresa: furgoneta, coche, camion, motocicleta"
    human_review: true

# ── CONCEPTOS ────────────────────────────────────────────────
# Mapeo concepto_key -> cuenta por defecto y flag human_review

conceptos:
  mercaderias:             { cuenta: "600", class: "gasto_deducible_interior",  human_review: false }
  materias_primas:         { cuenta: "601", class: "gasto_deducible_interior",  human_review: false }
  aprovisionamientos:      { cuenta: "602", class: "gasto_deducible_interior",  human_review: false }
  trabajos_subcontratados: { cuenta: "607", class: "gasto_deducible_interior",  human_review: false }
  alquiler_local:          { cuenta: "621", class: "gasto_deducible_interior",  human_review: false }
  reparacion_conservacion: { cuenta: "622", class: "gasto_deducible_interior",  human_review: false }
  profesional_independiente: { cuenta: "623", class: "gasto_deducible_interior", human_review: false }
  transporte:              { cuenta: "624", class: "gasto_deducible_interior",  human_review: false }
  seguro:                  { cuenta: "625", class: "gasto_no_deducible_iva",    human_review: false }
  gasto_bancario:          { cuenta: "626", class: "gasto_no_deducible_iva",    human_review: false }
  publicidad:              { cuenta: "627", class: "gasto_deducible_interior",  human_review: false }
  suministros:             { cuenta: "628", class: "gasto_deducible_interior",  human_review: false }
  servicios_generales:     { cuenta: "629", class: "gasto_deducible_interior",  human_review: false }
  tributo:                 { cuenta: "631", class: "gasto_no_deducible_iva",    human_review: false }
  nomina:                  { cuenta: "640", class: "gasto_no_deducible_iva",    human_review: true  }
  seguridad_social:        { cuenta: "642", class: "gasto_no_deducible_iva",    human_review: true  }
  venta_mercaderias:       { cuenta: "700", class: "ingreso_interior",          human_review: false }
  prestacion_servicios:    { cuenta: "705", class: "ingreso_interior",          human_review: false }
  instalacion_tecnica:     { cuenta: "212", class: "bien_inversion",            human_review: true  }
  maquinaria:              { cuenta: "213", class: "bien_inversion",            human_review: true  }
  mobiliario:              { cuenta: "216", class: "bien_inversion",            human_review: true  }
  equipo_informatico:      { cuenta: "217", class: "bien_inversion",            human_review: true  }
