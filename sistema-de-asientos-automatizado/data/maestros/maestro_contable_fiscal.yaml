# ── CLASES FISCALES ──────────────────────────────────────────

clases_fiscales:
  gasto_deducible_interior:   { book: "compras_gastos",   iva_expected: true  }
  gasto_no_deducible:         { book: "compras_gastos",   iva_expected: false }
  gasto_no_deducible_iva:     { book: "compras_gastos",   iva_expected: false }
  bien_inversion:             { book: "bienes_inversion", iva_expected: true  }
  ingreso_interior:           { book: "ingresos_ventas",  iva_expected: true  }
  gasto_intracomunitario:     { book: "compras_gastos",   iva_expected: false }
  ingreso_intracomunitario:   { book: "ingresos_ventas",  iva_expected: false }
  gasto_importacion:          { book: "compras_gastos",   iva_expected: false }
  gasto_isp:                  { book: "compras_gastos",   iva_expected: false }
  recargo_equivalencia:       { book: "compras_gastos",   iva_expected: true  }
