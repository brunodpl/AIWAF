[pytest]
# Limitar la recogida de tests a la carpeta tests/ para evitar que pytest
# intente importar test_3_cabecera.py (dentro de src/) como módulo raíz.
# Ese archivo usa sys.path.insert para importación local y falla cuando
# se recoge desde el directorio raíz del repositorio.
testpaths = tests
# Sin esto, `pytest tests/` (script standalone, sin `python -m`) no añade
# el cwd a sys.path y los tests con `from src import ...` fallan al recoger.
# En CI corremos exactamente `pytest tests/`.
pythonpath = .
