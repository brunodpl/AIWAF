name: AIWAF Release

# Se dispara al hacer push de un tag con formato vX.Y.Z (ej: v1.2.3)
# Construye las dos imágenes Docker (pipeline + interfaz), las publica en GHCR
# y actualiza latest.json en Cloudflare Pages para que las instalaciones
# existentes detecten la nueva versión.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (sin la v)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create git tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.value }}"
          git push origin "v${{ steps.version.outputs.value }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push pipeline image
        uses: docker/build-push-action@v6
        with:
          context: ./sistema-de-asientos-automatizado
          file: ./sistema-de-asientos-automatizado/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aiwaf-pipeline:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aiwaf-pipeline:latest
          build-args: |
            AIWAF_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=pipeline
          cache-to: type=gha,scope=pipeline,mode=max

      - name: Build & push interfaz image
        uses: docker/build-push-action@v6
        with:
          context: ./interfaz-asientos-automatizados
          file: ./interfaz-asientos-automatizados/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aiwaf-interfaz:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/aiwaf-interfaz:latest
          build-args: |
            AIWAF_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=interfaz
          cache-to: type=gha,scope=interfaz,mode=max

  publish-latest-json:
    name: Publish latest.json
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate latest.json
        shell: bash
        env:
          VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          mkdir -p _release

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            PREV_TAG=$(git describe --tags --abbrev=0 "v${VERSION}^" 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG=$(git log --pretty=format:'- %s' --max-count=10 "$PREV_TAG..v${VERSION}")
            else
              CHANGELOG=$(git log --pretty=format:'- %s' --max-count=10 "v${VERSION}")
            fi
          else
            CHANGELOG=$(git log --pretty=format:'- %s' --max-count=10 HEAD)
          fi

          cat > _release/latest.json <<EOF
          {
            "version": "${VERSION}",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "changelog": $(printf '%s' "$CHANGELOG" | jq -Rs .),
            "pipeline_image": "ghcr.io/${{ env.IMAGE_OWNER }}/aiwaf-pipeline:${VERSION}",
            "interfaz_image": "ghcr.io/${{ env.IMAGE_OWNER }}/aiwaf-interfaz:${VERSION}"
          }
          EOF

          cat _release/latest.json

      - name: Deploy latest.json to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          projectName: aiwaf-releases
          directory: _release
          # Sin esto el deploy va a una URL preview (XXXX.aiwaf-releases.pages.dev) y la
          # producción (aiwaf-releases.pages.dev/latest.json) queda congelada en una versión
          # vieja → los clientes nunca se enteran de nuevas versiones.
          branch: main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
