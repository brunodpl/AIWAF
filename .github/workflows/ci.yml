name: CI

# Gate de tests deterministas. Corre en cada PR y en cada push a main.
# Si rojo → bloquea el merge. La suite cara con Gemini real
# (`pnpm test:e2e:multi`, ~€0.20/run, ~9 min) NO entra aquí: queda manual/
# nocturna por decisión explícita (determinismo + coste).

on:
  pull_request:
  push:
    branches: [main]

# Concurrencia: si llegan dos pushes seguidos al mismo branch, cancelamos
# el anterior. El release pipeline (release.yml) tiene su propia trigger
# por tag y no se ve afectado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sistema-de-asientos-automatizado
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sistema-de-asientos-automatizado/requirements.txt
            sistema-de-asientos-automatizado/requirements-dev.txt

      - name: Install dependencies
        # Refleja el Dockerfile: requirements + fastapi[standard] (incluye
        # uvicorn y python-multipart) — el backend importa fastapi en
        # src/api/main.py pero no es runtime dep en requirements.txt porque
        # el Dockerfile lo añade aparte.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install "fastapi[standard]" uvicorn

      - name: Run pytest
        # Mockean GCP en todos los tests; no requiere credenciales.
        run: pytest tests/ -q --color=yes

  frontend-tests:
    name: Frontend (vitest + playwright hermético)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interfaz-asientos-automatizados
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: interfaz-asientos-automatizados/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vitest (unit + component)
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright (hermetic e2e)
        # Build prod + serve en :3110 con red mockeada por los specs.
        # No necesita pipeline-api ni Gemini.
        run: pnpm exec playwright test -c playwright.ci.config.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: interfaz-asientos-automatizados/playwright-report/
          retention-days: 7
